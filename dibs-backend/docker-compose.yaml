services:
  db:
    image: postgres:18              
    restart: unless-stopped      
    environment:
      POSTGRES_USER: ${db_user}
      POSTGRES_PASSWORD: ${db_password} 
      POSTGRES_DB: ${db_name}        
    ports:
      - "${db_port}:5432"          
    volumes:
      - db_data:/var/lib/postgresql            
    healthcheck:
      test: pg_isready -U ${db_user} -d ${db_name}
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  db_data:                      